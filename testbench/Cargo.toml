[package]
name = "ifetch-testbench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
console = "0.16.4"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = "1.42.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
url = "2.5.8"
zip = "8.6.0"
