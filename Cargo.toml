[package]
name = "ifetch"
version = "1.2.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
console = "0.16.4"
dialoguer = "0.12.0"
env_logger = "0.11.11"
indicatif = "0.18.6"
log = "0.4.34"
lru = "0.18.4"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = "1.42.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
url = "2.5.8"
zip = "8.6.0"
