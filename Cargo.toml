[package]
name = "ifetch"
version = "1.5.0"
edition = "2024"
description = "A fast MangaKatana downloader and self-hosted manga archive server"
repository = "https://github.com/FelixSiegel/ifetch"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive", "env"] }
console = "0.16.4"
dialoguer = { version = "0.12.0", default-features = false }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
http = "1.5.0"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
log = "0.4.34"
lru = "0.19.0"
regex = "1.13.1"
ureq = { version = "3.5.1", features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust_decimal = "1.42.1"
scraper = { version = "0.29.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
url = "2.5.8"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
